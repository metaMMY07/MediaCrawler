# Project-local Gradle configuration.
# NOTE: this file intentionally does NOT modify any system/user environment variable.

## JVM used to run Gradle (process/project scoped only).
# JDK is supplied by JAVA_HOME / scripts/build-local.ps1; no machine-specific path is committed.

# -Dfile.encoding / -Dsun.jnu.encoding: this checkout lives under a non-ASCII path.
# Without UTF-8 the JDK decodes the environment block through Cp1252 and turns the path
# into "????". Must match the launcher flags set in the patched gradlew.bat.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# ---------------------------------------------------------------------------
# GRADLE_USER_HOME: Gradle state is stored durably in <repo>\.gradle-user-home, but
# gradlew.bat / scripts/build.ps1 point GRADLE_USER_HOME at an ASCII-only directory
# junction to it, e.g.
#     C:\Users\30622\AppData\Local\Temp\<session>\mediasearch-gradle-home  ->  <repo>\.gradle-user-home
# Why: Gradle forks its daemon with "-javaagent:<GRADLE_USER_HOME>\..." and
# "-cp <GRADLE_USER_HOME>\..." on the command line. The JDK decodes command-line
# arguments through the ANSI code page (Cp1252 here), so this project's non-ASCII path
# would arrive as "????" and the daemon would die with:
#     Error opening zip file or JAR manifest missing : C:\...\????\...
# Gradle always forks a daemon (even --no-daemon starts a single-use one), so this
# cannot be side-stepped. An 8.3 short name does not help either: the JVM rejects a
# short path in -javaagent with "Unexpected error (103)". See docs/build-setup.md §7.
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.parallel=true
org.gradle.caching=true

## Keep the Kotlin compiler inside the Gradle JVM: the Kotlin daemon would be forked
## with this project's non-ASCII build paths on its command line.
kotlin.compiler.execution.strategy=in-process

## AndroidX only, and smaller R classes.
android.useAndroidX=true
android.nonTransitiveRClass=true

## AGP hard-fails the build when the project path contains non-ASCII characters.
## This checkout is C:\Users\30622\Documents\ChatGPT\聚合搜索, so the check has to be
## overridden or nothing can be built here at all. The underlying Windows risk is real
## (see docs/build-setup.md §7) and is mitigated by the ASCII GRADLE_USER_HOME junction
## plus the UTF-8 flags, not by this switch alone. If the project is ever moved to an
## ASCII-only directory, delete this line.
android.overridePathCheck=true

## BuildConfig/AIDL/RenderScript/shaders stay off by default; :app opts in explicitly.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

kotlin.incremental=true
kotlin.code.style=official
